[package]
name = "serial-mcp"
description = "MCP server over stdio that gives an AI host SerialBridge serial devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "serial-mcp"
path = "src/main.rs"

[lib]
name = "serial_mcp"
path = "src/lib.rs"

[dependencies]
serialbridge-protocol = { path = "../serialbridge-protocol" }
serialbridge-client = { path = "../serialbridge-client" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serial-core = { path = "../serial-core" }
serialbridge-client = { path = "../serialbridge-client" }
tempfile = "3"
nix = { workspace = true }
