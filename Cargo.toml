[workspace]
resolver = "2"
members = [
    "crates/serialbridge-protocol",
    "crates/serialbridge-client",
    "crates/serial-core",
    "crates/serial-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
crossbeam-channel = "0.5"
serialport = { version = "4.7", default-features = false }
nix = { version = "0.29", features = ["socket", "user", "fs", "term", "process"] }
libc = "0.2"
